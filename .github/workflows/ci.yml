name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.1'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun --bun playwright install --with-deps chromium
      - run: bun run test:e2e
      - run: bun run test:e2e:production
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
