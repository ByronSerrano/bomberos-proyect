<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f6" />
    <script>
      (() => {
        let theme = "light";
        let stored = null;
        try {
          stored = localStorage.getItem("disaster-replay:theme");
        } catch {
          stored = null;
        }
        if (stored === "dark" || stored === "light") theme = stored;
        document.documentElement.dataset.theme = theme;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#0e171e" : "#f7f8f6");
      })();
    </script>
    <meta name="description" content="Practica la interpretación de observaciones NASA FIRMS en un replay de decisiones con recursos didácticos y datos verificables." />
    <title>Disaster Replay · NASA observation lab</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Disaster Replay necesita JavaScript para mostrar el mapa y el ejercicio.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
